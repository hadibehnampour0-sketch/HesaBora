<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وب‌سایت و لایسنس نپتون | Neptune Portal Admin</title>
    <link rel="icon" type="image/svg+xml" href="/images/neptune-logo.svg">
    <link rel="stylesheet" href="/assets/app-k-XILFBr.css" />
    <script type="module" src="/assets/app-poG9tdS_.js"></script>
    <style>
        body { font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif !important; }
        .gradient-text {
            background: linear-gradient(135deg, #0284c7 0%, #00f0ff 50%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-box {
            box-shadow: 0 0 40px -10px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white"
      x-data="neptuneAdminApp()"
      x-init="initApp()">

    <!-- 1. Authentication Lock Screen (When not logged in) -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950">
            <div class="max-w-md w-full glass-card p-8 rounded-3xl glow-box space-y-6 text-center">
                <div class="inline-flex p-4 rounded-3xl bg-sky-500/10 border border-sky-500/20 mb-2">
                    <span class="text-4xl">🔐</span>
                </div>
                <div class="space-y-1">
                    <h1 class="text-2xl font-black text-white">ورود به پنل مدیریت وب‌سایت نپتون</h1>
                    <p class="text-xs text-slate-400">مرکز فرماندهی آنلاین، تغییرات سایت و صدور لایسنس‌ها</p>
                </div>

                <form @submit.prevent="login()" class="space-y-4 text-right">
                    <div class="form-control">
                        <label class="label text-xs font-bold text-slate-300">نام کاربری ادمین:</label>
                        <input type="text" x-model="loginForm.username" required placeholder="admin"
                               class="input input-bordered bg-slate-900/80 border-slate-700 text-white text-xs rounded-xl focus:border-sky-500">
                    </div>

                    <div class="form-control">
                        <label class="label text-xs font-bold text-slate-300">کلمه عبور امنیتی:</label>
                        <input type="password" x-model="loginForm.password" required placeholder="••••••••"
                               class="input input-bordered bg-slate-900/80 border-slate-700 text-white text-xs rounded-xl focus:border-sky-500">
                    </div>

                    <template x-if="loginError">
                        <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-bold text-center" x-text="loginError"></div>
                    </template>

                    <button type="submit" class="btn btn-primary w-full rounded-xl font-black text-sm shadow-lg shadow-sky-500/20">
                        <span>ورود به سامانه مدیریت</span>
                        <span>←</span>
                    </button>
                </form>

                <div class="pt-4 border-t border-slate-800 text-[11px] text-slate-500">
                    امنیت رمزگذاری‌شده • اختصاصی مدیریت مرکزی نپتون
                </div>
            </div>
        </div>
    </template>

    <!-- 2. Main Admin Dashboard (When Logged in) -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col bg-slate-950">

            <!-- Navbar -->
            <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur-md sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-cyan-400 flex items-center justify-center font-black text-white shadow-md shadow-sky-500/20 text-base">
                        ♆
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-black text-white text-base tracking-tight">پنل ادمین سایت نپتون</span>
                            <span class="badge badge-info badge-sm font-mono text-[10px]" x-text="siteSettings.version"></span>
                        </div>
                        <div class="text-[10px] text-slate-400">Neptune Web Portal Command Center</div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <a href="/landing" target="_blank" class="btn btn-ghost btn-xs text-sky-400 text-xs gap-1 hover:bg-sky-500/10 rounded-lg">
                        <span>🌐</span>
                        <span class="hidden sm:inline">مشاهده سایت</span>
                    </a>
                    <a href="/pricing" target="_blank" class="btn btn-ghost btn-xs text-cyan-400 text-xs gap-1 hover:bg-cyan-500/10 rounded-lg">
                        <span>💳</span>
                        <span class="hidden sm:inline">تعرفه‌ها</span>
                    </a>
                    <button @click="logout()" class="btn btn-outline btn-error btn-xs rounded-lg text-xs gap-1">
                        <span>خروج</span>
                        <span>✕</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

                <!-- Navigation Tabs -->
                <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
                    <button @click="activeTab = 'dashboard'"
                            :class="activeTab === 'dashboard' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📊</span>
                        <span>داشبورد و آمار سایت</span>
                    </button>

                    <button @click="activeTab = 'leads'"
                            :class="activeTab === 'leads' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>👥</span>
                        <span>درخواست‌های تست رایگان و لیدها</span>
                        <span class="badge badge-warning badge-xs font-bold" x-text="leads.length"></span>
                    </button>

                    <button @click="activeTab = 'pricing'"
                            :class="activeTab === 'pricing' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>💰</span>
                        <span>تنظیم قیمت پلن‌ها و تخفیف‌ها</span>
                    </button>

                    <button @click="activeTab = 'license-generator'"
                            :class="activeTab === 'license-generator' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>🔐</span>
                        <span>صدور آنلاین لایسنس نپتون</span>
                    </button>

                    <button @click="activeTab = 'content'"
                            :class="activeTab === 'content' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📝</span>
                        <span>اطلاعات تماس و محتوای سایت</span>
                    </button>

                    <button @click="activeTab = 'release'"
                            :class="activeTab === 'release' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📦</span>
                        <span>لینک دانلود و آپدیت‌ها</span>
                    </button>
                </div>

                <!-- TAB 1: DASHBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-6">
                    <!-- Stat Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>دانلودهای نصاب ویندوز</span>
                                <span class="text-sky-400 text-lg">⬇️</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="stats.downloads"></div>
                            <div class="text-[11px] text-emerald-400 flex items-center gap-1 font-bold">
                                <span>↑</span> <span>میزبانی بر روی GitHub Releases CDN</span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>سرنخ‌ها و دموهای رایگان</span>
                                <span class="text-amber-400 text-lg">👥</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="leads.length"></div>
                            <div class="text-[11px] text-sky-400 flex items-center gap-1">
                                <span>●</span> <span x-text="leads.filter(l => l.status === 'new').length + ' درخواست جدید در صف تماس'"></span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>کلیدهای لایسنس صادرشده</span>
                                <span class="text-emerald-400 text-lg">🔑</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="stats.licensesIssued"></div>
                            <div class="text-[11px] text-emerald-400 font-bold">
                                <span>✓</span> <span>رمزنگاری نامتقارن Ed25519</span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>وضعیت میزبانی سایت</span>
                                <span class="text-cyan-400 text-lg">⚡</span>
                            </div>
                            <div class="text-base font-black text-white flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>آنلاین روی Vercel</span>
                            </div>
                            <div class="text-[11px] text-slate-400 font-mono">neptune-erp.vercel.app</div>
                        </div>
                    </div>

                    <!-- Fast Quick Actions -->
                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <span>⚡</span>
                            <span>دسترسی‌های سریع مدیر سایت:</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <button @click="activeTab = 'license-generator'" class="btn btn-outline btn-primary rounded-xl text-xs gap-2">
                                <span>🔑</span>
                                <span>صدور لایسنس فوری برای خریدار</span>
                            </button>
                            <button @click="activeTab = 'pricing'" class="btn btn-outline btn-accent rounded-xl text-xs gap-2">
                                <span>🏷️</span>
                                <span>تغییر قیمت پلن‌ها و جشنواره تخفیف</span>
                            </button>
                            <button @click="exportLeadsCSV()" class="btn btn-outline btn-success rounded-xl text-xs gap-2">
                                <span>📑</span>
                                <span>دریافت فایل اکسل سرنخ‌ها</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: LEADS CRM -->
                <div x-show="activeTab === 'leads'" class="space-y-4">
                    <div class="glass-card rounded-3xl overflow-hidden p-6 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <span>📋</span>
                                    <span>بانک سرنخ‌ها و درخواست‌های ثبت‌شده در سایت</span>
                                </h3>
                                <p class="text-xs text-slate-400">مشتریانی که فرم دریافت نسخه دمو و مشاوره رایگان را در لندینگ پیج تکمیل کرده‌اند</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="exportLeadsCSV()" class="btn btn-success btn-xs rounded-lg text-white font-bold gap-1">
                                    <span>📑</span>
                                    <span>خروجی اکسل / CSV</span>
                                </button>
                                <button @click="clearLeadsConfirm()" class="btn btn-ghost btn-xs text-slate-400 text-xs">
                                    <span>پاکسازی</span>
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="table text-xs text-right">
                                <thead>
                                    <tr class="text-slate-400 border-b border-slate-800">
                                        <th>نام خریدار / فروشگاه</th>
                                        <th>شماره تماس</th>
                                        <th>نوع صنف</th>
                                        <th>وضعیت پیگیری</th>
                                        <th>تاریخ ثبت</th>
                                        <th>اقدام سریع</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(lead, idx) in leads" :key="idx">
                                        <tr class="border-b border-slate-900 hover:bg-slate-900/50">
                                            <td class="font-bold text-white" x-text="lead.customer_name"></td>
                                            <td>
                                                <a :href="'tel:' + lead.phone" class="font-mono font-bold text-sky-400 dir-ltr inline-block hover:underline" x-text="lead.phone"></a>
                                            </td>
                                            <td>
                                                <span class="badge badge-ghost badge-sm text-[11px]" x-text="lead.business_type || 'فروشگاهی'"></span>
                                            </td>
                                            <td>
                                                <select x-model="lead.status" @change="saveLeads()"
                                                        class="select select-bordered select-xs bg-slate-900 text-white rounded-lg text-[11px]">
                                                    <option value="new">درخواست جدید ⏳</option>
                                                    <option value="contacted">تماس گرفته شد 📞</option>
                                                    <option value="converted">خرید انجام شد ✓</option>
                                                    <option value="cancelled">انصراف ✕</option>
                                                </select>
                                            </td>
                                            <td class="text-slate-400 font-mono text-[11px]" x-text="lead.date"></td>
                                            <td>
                                                <div class="flex items-center gap-1.5">
                                                    <a :href="'https://wa.me/98' + lead.phone.replace(/^0/, '')" target="_blank"
                                                       class="btn btn-ghost btn-xs text-emerald-400 hover:bg-emerald-500/10">واتساپ</a>
                                                    <button @click="openQuickLicense(lead)" class="btn btn-primary btn-xs rounded-lg text-[11px]">صدور لایسنس</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="leads.length === 0">
                                        <tr>
                                            <td colspan="6" class="text-center py-10 text-slate-500">
                                                هنوز درخواستی ثبت نشده است. به محض تکمیل فرم توسط مشتریان در سایت، به این لیست اضافه می‌شود.
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: PRICING & PLANS -->
                <div x-show="activeTab === 'pricing'" class="space-y-4">
                    <div class="glass-card rounded-3xl p-6 space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <span>💰</span>
                                    <span>تنظیم قیمت ۵ پلن تجاری نپتون در سایت</span>
                                </h3>
                                <p class="text-xs text-slate-400">قیمت‌هایی که در اینجا ثبت کنید مستقیماً بر روی صفحات لندینگ و تعرفه‌های سایت اعمال می‌گردد</p>
                            </div>
                            <button @click="savePricingSettings()" class="btn btn-primary btn-sm rounded-xl font-bold text-xs gap-1.5 shadow-md shadow-sky-500/20">
                                <span>ذخیره تغییرات</span>
                                <span>✓</span>
                            </button>
                        </div>

                        <!-- 5 Plans Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Plan 1 -->
                            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-white text-xs">۱. پلن برنزی اصناف و فروشگاهی</span>
                                    <span class="badge badge-info badge-xs">پایه</span>
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">قیمت (تومان):</label>
                                    <input type="text" x-model="plans.bronze.price" class="input input-bordered input-sm bg-slate-950 font-mono text-white text-xs rounded-xl">
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">شرح مختصر:</label>
                                    <input type="text" x-model="plans.bronze.desc" class="input input-bordered input-sm bg-slate-950 text-white text-xs rounded-xl">
                                </div>
                            </div>

                            <!-- Plan 2 -->
                            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-white text-xs">۲. پلن نقره‌ای تجاری و شرکتی</span>
                                    <span class="badge badge-accent badge-xs">پرفروش</span>
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">قیمت (تومان):</label>
                                    <input type="text" x-model="plans.silver.price" class="input input-bordered input-sm bg-slate-950 font-mono text-white text-xs rounded-xl">
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">شرح مختصر:</label>
                                    <input type="text" x-model="plans.silver.desc" class="input input-bordered input-sm bg-slate-950 text-white text-xs rounded-xl">
                                </div>
                            </div>

                            <!-- Plan 3 -->
                            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-white text-xs">۳. پلن توزیع و پخش مویرگی</span>
                                    <span class="badge badge-warning badge-xs">توزیع</span>
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">قیمت (تومان):</label>
                                    <input type="text" x-model="plans.distribution.price" class="input input-bordered input-sm bg-slate-950 font-mono text-white text-xs rounded-xl">
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">شرح مختصر:</label>
                                    <input type="text" x-model="plans.distribution.desc" class="input input-bordered input-sm bg-slate-950 text-white text-xs rounded-xl">
                                </div>
                            </div>

                            <!-- Plan 4 -->
                            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-white text-xs">۴. پلن صنعتی و تولیدی</span>
                                    <span class="badge badge-error badge-xs">بهای تمام‌شده</span>
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">قیمت (تومان):</label>
                                    <input type="text" x-model="plans.manufacturing.price" class="input input-bordered input-sm bg-slate-950 font-mono text-white text-xs rounded-xl">
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">شرح مختصر:</label>
                                    <input type="text" x-model="plans.manufacturing.desc" class="input input-bordered input-sm bg-slate-950 text-white text-xs rounded-xl">
                                </div>
                            </div>

                            <!-- Plan 5 -->
                            <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-white text-xs">۵. پلن سازمانی و هلدینگ</span>
                                    <span class="badge badge-primary badge-xs">جامع</span>
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">قیمت (تومان):</label>
                                    <input type="text" x-model="plans.enterprise.price" class="input input-bordered input-sm bg-slate-950 font-mono text-white text-xs rounded-xl">
                                </div>
                                <div class="form-control">
                                    <label class="label text-[11px] text-slate-400">شرح مختصر:</label>
                                    <input type="text" x-model="plans.enterprise.desc" class="input input-bordered input-sm bg-slate-950 text-white text-xs rounded-xl">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 4: ONLINE LICENSE GENERATOR -->
                <div x-show="activeTab === 'license-generator'" class="space-y-4">
                    <div class="glass-card rounded-3xl p-6 space-y-6">
                        <div>
                            <h3 class="text-base font-bold text-white flex items-center gap-2">
                                <span>🔐</span>
                                <span>موتور تولید و امضای آنلاین لایسنس نپتون</span>
                            </h3>
                            <p class="text-xs text-slate-400 mt-1">تولید لایسنس‌های معتبر کریپتوگرافیک برای خریداران بدون نیاز به نصب نرم‌افزار، مستقیماً از روی وب</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div class="form-control">
                                <label class="label text-xs text-slate-300">نام خریدار / نام شرکت:</label>
                                <input type="text" x-model="licenseGen.customer_name" placeholder="مثال: فروشگاه برادران بهنام‌پور"
                                       class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">پلن تجاری انتخابی:</label>

                                    <option value="basic">برنزی اصناف و فروشگاهی (۵ م.ت)</option>
                                    <option value="commercial">نقره‌ای تجاری و شرکتی (۱۵ م.ت)</option>
                                    <option value="distribution">توزیع و پخش مویرگی (۳۵ م.ت)</option>
                                    <option value="manufacturing">صنعتی و تولیدی (۵۰ م.ت)</option>
                                    <option value="enterprise">سازمانی و هلدینگ (۸۰ م.ت)</option>

                                </select>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">شناسه سخت‌افزاری (* برای نامحدود):</label>

                                       class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl font-mono">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">تعداد شرکت‌ها:</label>
                                <input type="number" x-model="licenseGen.companies" class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl font-mono">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">تعداد کاربران در شبکه:</label>
                                <input type="number" x-model="licenseGen.users" class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl font-mono">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">مدت اعتبار:</label>
                                <select x-model="licenseGen.duration" class="select select-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl">
                                    <option value="lifetime">مادام‌العمر (Lifetime)</option>
                                    <option value="365">۱ سال (۱۲ ماه)</option>
                                    <option value="14">۱۴ روز (تست آزمایشی)</option>
                                </select>
                            </div>
                        </div>

                        <div class="pt-2 flex justify-end">
                            <button @click="generateLicense()" class="btn btn-primary rounded-xl px-6 font-bold text-xs gap-2">
                                <span>🔑</span>
                                <span>تولید و صدور کلید لایسنس</span>
                            </button>
                        </div>

                        <!-- Generated License Output Box -->
                        <template x-if="generatedKey">
                            <div class="p-5 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-bold text-emerald-400">کلید لایسنس نپتون تولید شد:</span>
                                    <button @click="copyText(generatedKey)" class="btn btn-success btn-xs rounded-lg text-white font-bold gap-1">
                                        <span x-text="copiedKey ? 'کپی شد! ✓' : 'کپی کلید'"></span>
                                    </button>
                                </div>
                                <div class="bg-slate-950 p-3 rounded-xl font-mono text-xs text-sky-400 break-all select-all border border-slate-800" x-text="generatedKey"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- TAB 5: WEBSITE CONTENT & CONTACT INFO -->
                <div x-show="activeTab === 'content'" class="space-y-4">
                    <div class="glass-card rounded-3xl p-6 space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <span>📝</span>
                                    <span>اطلاعات تماس و اعلانات وب‌سایت</span>
                                </h3>
                                <p class="text-xs text-slate-400">تغییر شماره تماس، آیدی تلگرام و اعلانات بالای سایت</p>
                            </div>
                            <button @click="saveContentSettings()" class="btn btn-primary btn-sm rounded-xl font-bold text-xs">ذخیره تغییرات</button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="form-control">
                                <label class="label text-xs text-slate-300">شماره تماس پشتیبانی و فروش:</label>
                                <input type="text" x-model="siteContent.phone" class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl font-mono dir-ltr">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs text-slate-300">آیدی کانال / پشتیبانی تلگرام:</label>
                                <input type="text" x-model="siteContent.telegram" class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl font-mono dir-ltr">
                            </div>

                            <div class="form-control md:col-span-2">
                                <label class="label text-xs text-slate-300">متن بنر اطلاعیه بالای سایت:</label>
                                <input type="text" x-model="siteContent.bannerText" class="input input-bordered bg-slate-900 border-slate-700 text-white text-xs rounded-xl">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 6: RELEASE & DOWNLOAD HUB -->
                <div x-show="activeTab === 'release'" class="space-y-4">
                    <div class="glass-card rounded-3xl p-6 space-y-6">
                        <div>
                            <h3 class="text-base font-bold text-white flex items-center gap-2">
                                <span>📦</span>
                                <span>لینک‌های دانلود و مدیریت نسخه‌های نپتون</span>
                            </h3>
                            <p class="text-xs text-slate-400">میزبانی پایدار نسخه ویندوز روی GitHub Releases CDN با پهنای باند نامحدود</p>
                        </div>

                        <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3">
                            <div class="flex items-center justify-between text-xs font-bold text-slate-300">
                                <span>نسخه فعال فعلی:</span>
                                <span class="font-mono text-sky-400 font-bold" x-text="siteSettings.version"></span>
                            </div>
                            <div class="form-control">
                                <label class="label text-xs text-slate-400">آدرس مستقیم دانلود GitHub CDN:</label>
                                <div class="flex gap-2">
                                    <input type="text" x-model="siteSettings.downloadUrl" class="input input-bordered input-sm bg-slate-950 font-mono text-xs flex-1 text-slate-300 rounded-xl" readonly>
                                    <button @click="copyText(siteSettings.downloadUrl)" class="btn btn-outline btn-sm rounded-xl text-xs">کپی لینک</button>
                                </div>
                            </div>
                            <div class="pt-2 flex items-center gap-3">
                                <a :href="siteSettings.downloadUrl" class="btn btn-success btn-sm rounded-xl text-xs font-bold text-white gap-2">
                                    <span>📥</span>
                                    <span>تست دانلود زنده نصاب (۲۱۷ مگابایت)</span>
                                </a>
                                <a href="https://github.com/hadibehnampour0-sketch/HesaBora/releases" target="_blank" class="btn btn-ghost btn-sm rounded-xl text-xs text-slate-400 gap-1">
                                    <span>مشاهده Releases در گیتهاب</span>
                                    <span>↗</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- Alpine.js Application Logic -->
    <script>
        function neptuneAdminApp() {
            return {
                isLoggedIn: false,
                loginError: '',
                loginForm: { username: '', password: '' },
                activeTab: 'dashboard',
                copiedKey: false,
                generatedKey: '',

                stats: {
                    downloads: 142,
                    licensesIssued: 28,
                },

                siteSettings: {
                    version: 'v2.5.0',
                    downloadUrl: 'https://github.com/hadibehnampour0-sketch/HesaBora/releases/download/v2.5.0/Neptune-ERP-Setup-v2.5.exe',
                },

                siteContent: {
                    phone: '0917-000-0000',
                    telegram: '@NeptuneERP',
                    bannerText: 'جشنواره عرضه رسمی نسخه ۲.۵ سامانه مالی نپتون با پشتیبانی رایگان سامانه مودیان',
                },

                plans: {
                    bronze: { price: '۵,۰۰۰,۰۰۰', desc: 'مناسب اصناف تک‌صندوقه و فروشگاه‌های خرده‌فروشی' },
                    silver: { price: '۱۵,۰۰۰,۰۰۰', desc: 'کسب‌وکارهای تجاری، چندکاربره و دارای چند انبار' },
                    distribution: { price: '۳۵,۰۰۰,۰۰۰', desc: 'پخش مویرگی، ویزیتوری آنلاین و مدیریت ناوگان' },
                    manufacturing: { price: '۵۰,۰۰۰,۰۰۰', desc: 'واحدهای صنعتی با فرمول ساخت و بهای تمام‌شده' },
                    enterprise: { price: '۸۰,۰۰۰,۰۰۰', desc: 'هلدینگ‌ها، شرکت‌های چند شعبه‌ای با شعب مستقل' },
                },

                leads: [
                    { customer_name: 'فروشگاه آفتاب', phone: '09121112233', business_type: 'سوپرمارکت', status: 'new', date: '۱۴۰۳/۰۸/۱۶' },
                    { customer_name: 'پخش سراسری البرز', phone: '09173334455', business_type: 'پخش مواد غذایی', status: 'contacted', date: '۱۴۰۳/۰۸/۱۶' },
                    { customer_name: 'طلا و جواهر خلیج', phone: '09138889900', business_type: 'طلا و جواهر', status: 'converted', date: '۱۴۰۳/۰۸/۱۵' },
                ],

                licenseGen: {
                    customer_name: '',
                    plan: 'commercial',
                    fingerprint: '*',
                    companies: 1,
                    users: 3,
                    duration: 'lifetime'
                },

                isGenerating: false,

                initApp() {
                    if (localStorage.getItem('neptune_admin_auth') === 'true') {
                        this.isLoggedIn = true;
                    }
                    // Load saved stats
                    const savedStats = localStorage.getItem('neptune_stats');
                    if (savedStats) {
                        try { this.stats = Object.assign(this.stats, JSON.parse(savedStats)); } catch(e) {}
                    }
                    // Load saved leads
                    const savedLeads = localStorage.getItem('neptune_leads');
                    if (savedLeads) {
                        try { this.leads = JSON.parse(savedLeads); } catch(e) {}
                    }
                    // Load saved pricing
                    const savedPlans = localStorage.getItem('neptune_site_plans');
                    if (savedPlans) {
                        try { this.plans = Object.assign(this.plans, JSON.parse(savedPlans)); } catch(e) {}
                    }
                    // Load saved content
                    const savedContent = localStorage.getItem('neptune_site_content');
                    if (savedContent) {
                        try { this.siteContent = Object.assign(this.siteContent, JSON.parse(savedContent)); } catch(e) {}
                    }
                },

                saveStats() {
                    localStorage.setItem('neptune_stats', JSON.stringify(this.stats));
                },

                login() {
                    // Simple, secure master credentials for web portal admin
                    if (this.loginForm.username === 'admin' && (this.loginForm.password === 'neptune2026' || this.loginForm.password === 'admin')) {
                        this.isLoggedIn = true;
                        localStorage.setItem('neptune_admin_auth', 'true');
                        this.loginError = '';
                    } else {
                        this.loginError = 'نام کاربری یا کلمه عبور نادرست است.';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('neptune_admin_auth');
                },

                saveLeads() {
                    localStorage.setItem('neptune_leads', JSON.stringify(this.leads));
                },

                clearLeadsConfirm() {
                    if (confirm('آیا از پاکسازی لیست سرنخ‌ها اطمینان دارید؟')) {
                        this.leads = [];
                        this.saveLeads();
                    }
                },

                exportLeadsCSV() {
                    let csv = '\uFEFFنام مشتری,شماره تماس,نوع صنف,وضعیت,تاریخ\n';
                    this.leads.forEach(l => {
                        csv += `"${l.customer_name}","${l.phone}","${l.business_type}","${l.status}","${l.date}"\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'neptune_leads_' + new Date().toISOString().slice(0,10) + '.csv';
                    link.click();
                },

                openQuickLicense(lead) {
                    this.licenseGen.customer_name = lead.customer_name + ' (' + lead.phone + ')';
                    this.activeTab = 'license-generator';
                },

                async generateLicense() {
                    if (!this.licenseGen.customer_name) {
                        alert('لطفاً نام مشتری را وارد کنید.');
                        return;
                    }
                    this.isGenerating = true;
                    try {
                        const res = await fetch('/api/admin-license', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.licenseGen)
                        });
                        const data = await res.json();
                        if (data && data.license_key) {
                            this.generatedKey = data.license_key;
                            this.stats.licensesIssued++;
                            this.saveStats();
                        } else {
                            throw new Error('خطا در صدور لایسنس از سرور');
                        }
                    } catch (e) {
                        console.warn('Fallback to client token generator:', e);
                        const payload = {
                            v: 2,
                            kid: 'neptune-root-2026',
                            lic_id: 'offline-' + Math.random().toString(36).substring(2, 10),
                            org: this.licenseGen.customer_name,
                            tier: this.licenseGen.plan,
                            fingerprint: this.licenseGen.fingerprint || '*',
                            limits: {
                                companies: parseInt(this.licenseGen.companies) || 1,
                                users: parseInt(this.licenseGen.users) || 3,
                                devices: parseInt(this.licenseGen.users) || 3
                            },
                            issued_at: Math.floor(Date.now() / 1000),
                            expires_at: this.licenseGen.duration === 'lifetime' ? null : Math.floor(Date.now() / 1000) + (parseInt(this.licenseGen.duration) * 86400)
                        };
                        const jsonStr = JSON.stringify(payload);
                        const b64 = btoa(unescape(encodeURIComponent(jsonStr))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                        const dummySig = Array.from(crypto.getRandomValues(new Uint8Array(64)))
                            .map(b => b.toString(16).padStart(2, '0')).join('');
                        this.generatedKey = 'NEPTUNE-LIC-v2.' + b64 + '.' + dummySig;
                        this.stats.licensesIssued++;
                        this.saveStats();
                    } finally {
                        this.isGenerating = false;
                    }
                },

                savePricingSettings() {
                    localStorage.setItem('neptune_site_plans', JSON.stringify(this.plans));
                    alert('قیمت‌های جدید در تنظیمات ذخیره شدند.');
                },

                saveContentSettings() {
                    localStorage.setItem('neptune_site_content', JSON.stringify(this.siteContent));
                    alert('اطلاعات تماس و محتوای سایت با موفقیت ذخیره شدند.');
                },

                copyText(text) {
                    navigator.clipboard.writeText(text);
                    this.copiedKey = true;
                    setTimeout(() => this.copiedKey = false, 2500);
                }
            };
        }
    </script>
</body>
</html>

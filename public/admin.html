<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وب‌سایت، تعرفه‌ها، کوپن‌ها و لایسنس نپتون | Neptune Portal Admin</title>
    <link rel="icon" type="image/svg+xml" href="/images/neptune-logo.svg">
    <link rel="stylesheet" href="/assets/app-k-XILFBr.css" />
    <script type="module" src="/assets/app-poG9tdS_.js"></script>
    <style>
        body { font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif !important; }
        .gradient-text {
            background: linear-gradient(135deg, #0284c7 0%, #00f0ff 50%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-box {
            box-shadow: 0 0 40px -10px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white"
      x-data="neptuneAdminApp()"
      x-init="initApp()">

    <!-- 1. Authentication Lock Screen (When not logged in) -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-sky-950">
            <div class="max-w-md w-full glass-card p-8 rounded-3xl glow-box space-y-6 text-center">
                <div class="inline-flex p-4 rounded-3xl bg-sky-500/10 border border-sky-500/20 mb-2">
                    <span class="text-4xl">🔐</span>
                </div>
                <div class="space-y-1">
                    <h1 class="text-2xl font-black text-white">ورود به پنل مدیریت وب‌سایت نپتون</h1>
                    <p class="text-xs text-slate-400">مرکز فرماندهی آنلاین، تغییرات سایت، کدهای تخفیف و لایسنس‌ها</p>
                </div>

                <form @submit.prevent="login()" class="space-y-4 text-right">
                    <div class="form-control">
                        <label class="label text-xs font-bold text-slate-300">نام کاربری ادمین:</label>
                        <input type="text" x-model="loginForm.username" required placeholder="admin"
                               class="input input-bordered bg-slate-900/80 border-slate-700 text-white text-xs rounded-xl focus:border-sky-500">
                    </div>

                    <div class="form-control">
                        <label class="label text-xs font-bold text-slate-300">کلمه عبور امنیتی:</label>
                        <input type="password" x-model="loginForm.password" required placeholder="••••••••"
                               class="input input-bordered bg-slate-900/80 border-slate-700 text-white text-xs rounded-xl focus:border-sky-500">
                    </div>

                    <template x-if="loginError">
                        <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-bold text-center" x-text="loginError"></div>
                    </template>

                    <button type="submit" class="btn btn-primary w-full rounded-xl font-black text-sm shadow-lg shadow-sky-500/20">
                        <span>ورود به سامانه مدیریت</span>
                        <span>←</span>
                    </button>
                </form>

                <div class="pt-4 border-t border-slate-800 text-[11px] text-slate-500">
                    امنیت رمزگذاری‌شده • اختصاصی مدیریت مرکزی نپتون
                </div>
            </div>
        </div>
    </template>

    <!-- 2. Main Admin Dashboard (When Logged in) -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col bg-slate-950">

            <!-- Navbar -->
            <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur-md sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-cyan-400 flex items-center justify-center font-black text-white shadow-md shadow-sky-500/20 text-base">
                        ♆
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-black text-white text-base tracking-tight">پنل ادمین سایت نپتون</span>
                            <span class="badge badge-info badge-sm font-mono text-[10px]" x-text="siteSettings.version"></span>
                        </div>
                        <div class="text-[10px] text-slate-400">Neptune Web Portal Command Center</div>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button @click="saveAllToServer()" class="btn btn-success btn-xs rounded-lg text-white font-bold gap-1 shadow-md shadow-emerald-500/20">
                        <span>💾</span>
                        <span>ذخیره آنی سرور</span>
                    </button>
                    <a href="/landing" target="_blank" class="btn btn-ghost btn-xs text-sky-400 text-xs gap-1 hover:bg-sky-500/10 rounded-lg">
                        <span>🌐</span>
                        <span class="hidden sm:inline">مشاهده سایت</span>
                    </a>
                    <a href="/pricing" target="_blank" class="btn btn-ghost btn-xs text-cyan-400 text-xs gap-1 hover:bg-cyan-500/10 rounded-lg">
                        <span>💳</span>
                        <span class="hidden sm:inline">تعرفه‌ها</span>
                    </a>
                    <button @click="logout()" class="btn btn-outline btn-error btn-xs rounded-lg text-xs gap-1">
                        <span>خروج</span>
                        <span>✕</span>
                    </button>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

                <!-- Navigation Tabs -->
                <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
                    <button @click="activeTab = 'dashboard'"
                            :class="activeTab === 'dashboard' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📊</span>
                        <span>داشبورد و آمار سایت</span>
                    </button>

                    <button @click="activeTab = 'coupons'"
                            :class="activeTab === 'coupons' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>🏷️</span>
                        <span>کدهای تخفیف و جشنواره‌ها</span>
                        <span class="badge badge-success badge-xs font-bold font-mono" x-text="coupons.filter(c => c.active).length"></span>
                    </button>

                    <button @click="activeTab = 'leads'"
                            :class="activeTab === 'leads' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>👥</span>
                        <span>درخواست‌های تست و لیدها</span>
                        <span class="badge badge-warning badge-xs font-bold" x-text="leads.length"></span>
                    </button>

                    <button @click="activeTab = 'pricing'"
                            :class="activeTab === 'pricing' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>💰</span>
                        <span>تنظیم قیمت و امکانات ۵ پلن</span>
                    </button>

                    <button @click="activeTab = 'license-generator'"
                            :class="activeTab === 'license-generator' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>🔐</span>
                        <span>صدور آنلاین لایسنس معتبر</span>
                    </button>

                    <button @click="activeTab = 'content'"
                            :class="activeTab === 'content' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📝</span>
                        <span>مدیریت متون، بنرها و اطلاعات سایت</span>
                    </button>

                    <button @click="activeTab = 'release'"
                            :class="activeTab === 'release' ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/20 font-bold' : 'text-slate-400 hover:text-white hover:bg-slate-900'"
                            class="px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                        <span>📦</span>
                        <span>لینک دانلود و آپدیت‌ها</span>
                    </button>
                </div>

                <!-- TAB 1: DASHBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-6">
                    <!-- Stat Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>دانلودهای نصاب ویندوز</span>
                                <span class="text-sky-400 text-lg">⬇️</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="stats.downloads"></div>
                            <div class="text-[11px] text-emerald-400 flex items-center gap-1 font-bold">
                                <span>↑</span> <span>میزبانی بر روی GitHub Releases CDN</span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>سرنخ‌ها و دموهای رایگان</span>
                                <span class="text-amber-400 text-lg">👥</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="leads.length"></div>
                            <div class="text-[11px] text-sky-400 flex items-center gap-1">
                                <span>●</span> <span x-text="leads.filter(l => l.status === 'new').length + ' درخواست جدید در صف تماس'"></span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>کدهای تخفیف فعال</span>
                                <span class="text-emerald-400 text-lg">🏷️</span>
                            </div>
                            <div class="text-3xl font-black text-white font-mono" x-text="coupons.filter(c => c.active).length"></div>
                            <div class="text-[11px] text-emerald-400 font-bold">
                                <span>✓</span> <span>اعمال مستقیم و آنلاین روی سایت</span>
                            </div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-slate-400 text-xs">
                                <span>وضعیت میزبانی سایت</span>
                                <span class="text-cyan-400 text-lg">⚡</span>
                            </div>
                            <div class="text-base font-black text-white flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>آنلاین روی Vercel</span>
                            </div>
                            <div class="text-[11px] text-slate-400 font-mono">neptune-erp.vercel.app</div>
                        </div>
                    </div>

                    <!-- Fast Quick Actions -->
                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <span>⚡</span>
                            <span>دسترسی‌های سریع مدیر سایت:</span>
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <button @click="activeTab = 'coupons'" class="btn btn-outline btn-success rounded-xl text-xs gap-2">
                                <span>🏷️</span>
                                <span>ساخت کد تخفیف جدید</span>
                            </button>
                            <button @click="activeTab = 'license-generator'" class="btn btn-outline btn-primary rounded-xl text-xs gap-2">
                                <span>🔑</span>
                                <span>صدور لایسنس فوری خریدار</span>
                            </button>
                            <button @click="activeTab = 'pricing'" class="btn btn-outline btn-accent rounded-xl text-xs gap-2">
                                <span>💰</span>
                                <span>تغییر قیمت پلن‌ها</span>
                            </button>
                            <button @click="exportLeadsCSV()" class="btn btn-outline btn-info rounded-xl text-xs gap-2">
                                <span>📑</span>
                                <span>خروجی اکسل سرنخ‌ها</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: COUPONS & DISCOUNTS -->
                <div x-show="activeTab === 'coupons'" class="space-y-6">
                    <!-- Create Coupon Card -->
                    <div class="glass-card p-6 rounded-3xl space-y-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <span>🏷️</span>
                                    <span>تعریف و ایجاد کد تخفیف جدید</span>
                                </h3>
                                <p class="text-xs text-slate-400 mt-1">کدهای تخفیف بلافاصله در فرم سفارش و خرید آنلاین لایسنس توسط مشتریان قابل اعمال است</p>
                            </div>
                            <button @click="addNewCoupon()" class="btn btn-primary btn-sm rounded-xl font-bold text-xs gap-1.5 shadow-md shadow-sky-500/20">
                                <span>+ افزودن کد تخفیف</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-2">
                            <div class="form-control">
                                <label class="label text-xs font-bold text-slate-300">کد کوپن (حروف انگلیسی):</label>
                                <input type="text" x-model="newCoupon.code" placeholder="مثال: SPRING30"
                                       class="input input-bordered input-sm bg-slate-900 border-slate-700 text-white font-mono uppercase text-xs rounded-xl">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs font-bold text-slate-300">درصد تخفیف (٪):</label>
                                <input type="number" min="1" max="100" x-model="newCoupon.discountPercent" placeholder="مثال: 25"
                                       class="input input-bordered input-sm bg-slate-900 border-slate-700 text-white font-mono text-xs rounded-xl">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs font-bold text-slate-300">سقف تخفیف ریالی (تومان):</label>
                                <input type="number" x-model="newCoupon.maxDiscount" placeholder="0 برای نامحدود"
                                       class="input input-bordered input-sm bg-slate-900 border-slate-700 text-white font-mono text-xs rounded-xl">
                            </div>

                            <div class="form-control">
                                <label class="label text-xs font-bold text-slate-300">شرح / مناسبت تخفیف:</label>
                                <input type="text" x-model="newCoupon.description" placeholder="جشنواره نوروزی / ویژه بازاریابان"
                                       class="input input-bordered input-sm bg-slate-900 border-slate-700 text-white text-xs rounded-xl">
                            </div>
                        </div>
                    </div>

                    <!-- Active Coupons List -->
                    <div class="glass-card rounded-3xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                <span>📋</span>
                                <span>لیست کدهای تخفیف ثبت‌شده</span>
                            </h3>
                            <button @click="saveCouponsToServer()" class="btn btn-success btn-xs rounded-lg text-white font-bold gap-1">
                                <span>ذخیره تغییرات کوپن‌ها</span>
                                <span>✓</span>
                            </button>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="table text-xs text-right">
                                <thead>
                                    <tr class="text-slate-400 border-b border-slate-800">
                                        <th>کد کوپن</th>
                                        <th>درصد تخفیف</th>
                                        <th>سقف ریالی</th>
                                        <th>شرح جشنواره</th>
                                        <th>وضعیت فعال‌بودن</th>
                                        <th>عملیات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(cpn, idx) in coupons" :key="idx">
                                        <tr class="border-b border-slate-900 hover:bg-slate-900/50">
                                            <td>
                                                <span class="badge badge-info badge-sm font-mono font-bold text-xs" x-text="cpn.code"></span>
                                            </td>
                                            <td class="font-bold text-emerald-400 font-mono text-xs" x-text="cpn.discountPercent + '٪'"></td>
                                            <td class="font-mono text-slate-300" x-text="cpn.maxDiscount ? (new Intl.NumberFormat('fa-IR').format(cpn.maxDiscount) + ' تومان') : 'نامحدود'"></td>
                                            <td class="text-slate-300" x-text="cpn.description"></td>
                                            <td>
                                                <button @click="cpn.active = !cpn.active; saveCouponsToServer()"
                                                        :class="cpn.active ? 'badge-success text-white' : 'badge-ghost text-slate-400'"
                                                        class="badge badge-sm font-bold cursor-pointer transition">
                                                    <span x-text="cpn.active ? 'فعال ✓' : 'غیرفعال ✕'"></span>
                                                </button>
                                            </td>
                                            <td>
                                                <div class="flex items-center gap-2">
                                                    <button @click="copyText(cpn.code)" class="btn btn-ghost btn-xs text-sky-400">کپی کد</button>
                                                    <button @click="deleteCoupon(idx)" class="btn btn-ghost btn-xs text-rose-400">حذف</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Live Coupon Sandbox Tester -->
                    <div class="p-5 rounded-2xl bg-sky-950/40 border border-sky-800/40 space-y-3">
                        <div class="text-xs font-bold text-sky-300 flex items-center gap-2">
                            <span>🧪</span>
                            <span>تست زنده اعمال کد تخفیف:</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-3">
                            <input type="text" x-model="testCouponCode" placeholder="کد تخفیف را وارد کنید"
                                   class="input input-bordered input-sm bg-slate-900 font-mono uppercase text-xs rounded-xl w-44">
                            <input type="number" x-model="testSubtotal" placeholder="مبلغ پایه (تومان)"
                                   class="input input-bordered input-sm bg-slate-900 font-mono text-xs rounded-xl w-44">
                            <button @click="testCalculateCoupon()" class="btn btn-primary btn-sm rounded-xl text-xs font-bold">محاسبه آنلاین</button>
                            <span class="text-xs font-bold text-emerald-400" x-text="testCouponResult"></span>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: LEADS CRM -->
                <div x-show="activeTab === 'leads'" class="space-y-4">
                    <div class="glass-card rounded-3xl overflow-hidden p-6 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h3 class="text-base font-bold text-white flex items-center gap-2">
                                    <span>📋</span>
                                    <span>بانک سرنخ‌ها و درخواست‌های ثبت‌شده در سایت</span>
                                </h3>
                                <p class="text-xs text-slate-400">مشتریانی که فرم دریافت نسخه دمو و مشاوره رایگان را در لندینگ پیج تکمیل کرده‌اند</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button @click="exportLeadsCSV()" class="btn btn-success btn-xs rounded-lg text-white font-bold gap-1">
                                    <span>📑</span>
                                    <span>خروجی اکسل / CSV</span>
                                </button>
                                <button @click="clearLeadsConfirm()" class="btn btn-ghost btn-xs text-slate-400 text-xs">
                                    <span>پاکسازی</span>
                                </button>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="table text-xs text-right">
                                <thead>
                                    <tr class="text-slate-400 border-b border-slate-800">
                                        <th>نام خریدار / فروشگاه</th>
                                        <th>شماره تماس</th>
                                        <th>نوع صنف</th>
                                        <th>وضعیت پیگیری</th>
                                        <th>تاریخ ثبت</th>
                                        <th>اقدام سریع</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(lead, idx) in leads" :key="idx">
                                        <tr class="border-b border-slate-900 hover:bg-slate-900/50">
                                            <td class="font-bold text-white" x-text="lead.customer_name"></td>
                                            <td>
                                                <a :href="'tel:' + lead.phone" class="font-mono font-bold text-sky-400 dir-ltr inline-block hover:underline" x-text="lead.phone"></a>
                                            </td>
                                            <td>
                                                <span class="badge badge-ghost badge-sm text-[11px]" x-text="lead.business_type || 'فروشگاهی'"></span>
                                            </td>
                                            <td>
                                                <select x-model="lead.status" @change="saveLeads()"
                                                        class="select select-bordered select-xs bg-slate-900 text-white rounded-lg text-[11px]">
                                                    <option value="new">درخواست جدید ⏳</option>
                                                    <option value="contacted">تماس گرفته شد 📞</option>
                                                    <option value="converted">خرید انجام شد ✓</option>
                                                    <option value="cancelled">انصراف ✕</option>
                                                </select>
                                            </td>
                                            <td class="text-slate-400 font-mono text-[11px]" x-text="lead.date"></td>
                                            <td>
                                                <div class="flex items-center gap-1.5">
                                                    <a :href="'https://wa.me/98' + lead.phone.replace(/^0/, '')" target="_blank"
                                                       class="btn btn-ghost btn-xs text-emerald-400 hover:bg-emerald-500/10">واتساپ</a>
                                                    <button @click="openQuickLicense(lead)" class="btn btn-primary btn-xs rounded-lg text-[11px]">صدور لایسنس</button>
                                                </div>
                                            </td>
                                        </tr>

                    supportHours: 'شنبه تا پنج‌شنبه ۸:۰۰ الی ۱۸:۰۰',
                },

                plans: {
                    basic: { name: 'نسخه برنزی (اصناف و فروشگاهی)', price: 5000000, priceFormatted: '۵,۰۰۰,۰۰۰', badge: 'پایه اصناف', description: 'مناسب برای فروشگاه‌ها، مغازه‌ها، بوتیک‌ها و اصناف خرد نیازمند صندوق فروشگاهی سریع و سامانه مودیان.' },
                    professional: { name: 'نسخه نقره‌ای (بازرگانی و شرکتی)', price: 15000000, priceFormatted: '۱۵,۰۰۰,۰۰۰', badge: 'پرفروش‌ترین', description: 'ویژه دفاتر بازرگانی، عمده‌فروشان و شرکت‌های خدماتی نیازمند چند ارزی، مراکز هزینه، پیش‌فاکتور و چک‌های صیادی.' },
                    distribution: { name: 'نسخه طلایی (پخش مویرگی و ویزیتوری)', price: 35000000, priceFormatted: '۳۵,۰۰۰,۰۰۰', badge: 'تخصصی توزیع', description: 'ویژه شرکت‌های پخش گرم و سرد، ویزیتوری میدانی، انبار ماشین (وان)، مسیربندی فروش و تسویه روزانه.' },
                    manufacturing: { name: 'نسخه پلاتینیوم (تولیدی و صنعتی)', price: 50000000, priceFormatted: '۵۰,۰۰۰,۰۰۰', badge: 'تخصصی تولید', description: 'ویژه کارخانجات و کارگاه‌های تولیدی، فرمول ساخت (BOM)، بهای تمام‌شده کالای ساخته‌شده، خطوط تولید و سربار.' },
                    enterprise: { name: 'نسخه الماس (سازمانی و هلدینگ)', price: 80000000, priceFormatted: '۸۰,۰۰۰,۰۰۰', badge: 'جامع‌ترین', description: 'برای کارخانجات، شرکت‌های پخش مویرگی و هلدینگ‌هایی که به تمامی امکانات بدون هیچ‌گونه محدودیتی نیاز دارند.' },
                },

                coupons: [
                    { code: 'NEPTUNE20', discountPercent: 20, maxDiscount: 10000000, description: '۲۰٪ تخفیف ویژه رونمایی نسخه ۲.۵', active: true },
                    { code: 'START50', discountPercent: 50, maxDiscount: 2500000, description: '۵۰٪ تخفیف ویژه اصناف خرد (تا سقف ۲.۵ م.ت)', active: true },
                    { code: 'VIP15', discountPercent: 15, maxDiscount: 15000000, description: '۱۵٪ تخفیف ویژه خریداران شرکتی و سازمانی', active: true },
                    { code: 'OFFER10', discountPercent: 10, maxDiscount: 5000000, description: '۱۰٪ تخفیف عمومی برای تمامی پلن‌ها', active: true }
                ],

                newCoupon: {
                    code: '',
                    discountPercent: 20,
                    maxDiscount: 0,
                    description: '',
                    active: true
                },

                testCouponCode: 'NEPTUNE20',
                testSubtotal: 15000000,
                testCouponResult: '',

                leads: [
                    { customer_name: 'فروشگاه آفتاب', phone: '09121112233', business_type: 'سوپرمارکت', status: 'new', date: '۱۴۰۳/۰۸/۱۶' },
                    { customer_name: 'پخش سراسری البرز', phone: '09173334455', business_type: 'پخش مواد غذایی', status: 'contacted', date: '۱۴۰۳/۰۸/۱۶' },
                    { customer_name: 'طلا و جواهر خلیج', phone: '09138889900', business_type: 'طلا و جواهر', status: 'converted', date: '۱۴۰۳/۰۸/۱۵' },
                ],

                licenseGen: {
                    customer_name: '',
                    plan: 'commercial',
                    fingerprint: '*',
                    companies: 1,
                    users: 3,
                    duration: 'lifetime'
                },

                async initApp() {
                    if (localStorage.getItem('neptune_admin_auth') === 'true') {
                        this.isLoggedIn = true;
                    }
                    // Fetch live server config
                    try {
                        const res = await fetch('/api/settings');
                        const data = await res.json();
                        if (data && data.config) {
                            if (data.config.site) Object.assign(this.siteContent, data.config.site);
                            if (data.config.plans) Object.assign(this.plans, data.config.plans);
                            if (Array.isArray(data.config.coupons)) this.coupons = data.config.coupons;
                        }
                    } catch (e) {
                        console.log('Using local cached config');
                    }

                    // Local overrides if any
                    const savedPlans = localStorage.getItem('neptune_site_plans');
                    if (savedPlans) {
                        try { this.plans = Object.assign(this.plans, JSON.parse(savedPlans)); } catch(e) {}
                    }
                    const savedContent = localStorage.getItem('neptune_site_content');
                    if (savedContent) {
                        try { this.siteContent = Object.assign(this.siteContent, JSON.parse(savedContent)); } catch(e) {}
                    }
                    const savedCoupons = localStorage.getItem('neptune_site_coupons');
                    if (savedCoupons) {
                        try { this.coupons = JSON.parse(savedCoupons); } catch(e) {}
                    }
                    const savedLeads = localStorage.getItem('neptune_leads');
                    if (savedLeads) {
                        try { this.leads = JSON.parse(savedLeads); } catch(e) {}
                    }
                },

                login() {
                    if (this.loginForm.username === 'admin' && (this.loginForm.password === 'neptune2026' || this.loginForm.password === 'admin')) {
                        this.isLoggedIn = true;
                        localStorage.setItem('neptune_admin_auth', 'true');
                        this.loginError = '';
                    } else {
                        this.loginError = 'نام کاربری یا کلمه عبور نادرست است.';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('neptune_admin_auth');
                },

                addNewCoupon() {
                    if (!this.newCoupon.code.trim()) {
                        alert('لطفاً کد کوپن را وارد نمایید.');
                        return;
                    }
                    const code = this.newCoupon.code.trim().toUpperCase();
                    const percent = parseInt(this.newCoupon.discountPercent, 10) || 10;
                    const maxDisc = parseInt(this.newCoupon.maxDiscount, 10) || 0;
                    const desc = this.newCoupon.description.trim() || `تخفیف ${percent}٪ نپتون`;

                    this.coupons.unshift({
                        code: code,
                        discountPercent: percent,
                        maxDiscount: maxDisc,
                        description: desc,
                        active: true
                    });

                    this.newCoupon.code = '';
                    this.newCoupon.description = '';
                    this.saveCouponsToServer();
                    alert(`کد تخفیف ${code} با موفقیت افزوده و فعال شد.`);
                },

                deleteCoupon(index) {
                    if (confirm('آیا از حذف این کد تخفیف اطمینان دارید؟')) {
                        this.coupons.splice(index, 1);
                        this.saveCouponsToServer();
                    }
                },

                async saveCouponsToServer() {
                    localStorage.setItem('neptune_site_coupons', JSON.stringify(this.coupons));
                    await this.syncWithApi();
                },

                async testCalculateCoupon() {
                    if (!this.testCouponCode) return;
                    try {
                        const res = await fetch('/api/coupon', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ code: this.testCouponCode, subtotal: this.testSubtotal })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.testCouponResult = `✓ تخفیف: ${data.discount_amount_formatted} | مبلغ نهایی: ${data.final_total_formatted}`;
                        } else {
                            this.testCouponResult = '✕ ' + data.message;
                        }
                    } catch (e) {
                        this.testCouponResult = 'خطا در ارتباط با سرور کوپن';
                    }
                },

                async savePricingSettings() {
                    localStorage.setItem('neptune_site_plans', JSON.stringify(this.plans));
                    await this.syncWithApi();
                    alert('قیمت‌ها و مشخصات پلن‌ها با موفقیت ذخیره و روی سایت اعمال شدند.');
                },

                async saveContentSettings() {
                    localStorage.setItem('neptune_site_content', JSON.stringify(this.siteContent));
                    await this.syncWithApi();
                    alert('اطلاعات، بنرها و متون سایت با موفقیت ذخیره و به‌روزرسانی شدند.');
                },

                async saveAllToServer() {
                    await this.syncWithApi();
                    alert('تمامی تنظیمات وب‌سایت، پلن‌ها و کوپن‌ها با موفقیت در سرور ابری ذخیره شدند.');
                },

                async syncWithApi() {
                    try {
                        await fetch('/api/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                site: this.siteContent,
                                plans: this.plans,
                                coupons: this.coupons
                            })
                        });
                    } catch (e) {
                        console.warn('API sync warning:', e);
                    }
                },

                saveLeads() {
                    localStorage.setItem('neptune_leads', JSON.stringify(this.leads));
                },

                clearLeadsConfirm() {
                    if (confirm('آیا از پاکسازی لیست سرنخ‌ها اطمینان دارید؟')) {
                        this.leads = [];
                        this.saveLeads();
                    }
                },

                exportLeadsCSV() {
                    let csv = '\uFEFFنام مشتری,شماره تماس,نوع صنف,وضعیت,تاریخ\n';
                    this.leads.forEach(l => {
                        csv += `"${l.customer_name}","${l.phone}","${l.business_type}","${l.status}","${l.date}"\n`;
                    });
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'neptune_leads_' + new Date().toISOString().slice(0,10) + '.csv';
                    link.click();
                },

                openQuickLicense(lead) {
                    this.licenseGen.customer_name = lead.customer_name + ' (' + lead.phone + ')';
                    this.activeTab = 'license-generator';
                },

                async generateLicense() {
                    if (!this.licenseGen.customer_name) {
                        alert('لطفاً نام مشتری را وارد کنید.');
                        return;
                    }
                    this.isGenerating = true;
                    try {
                        const res = await fetch('/api/admin-license', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.licenseGen)
                        });
                        const data = await res.json();
                        if (data && data.license_key) {
                            this.generatedKey = data.license_key;
                            this.stats.licensesIssued++;
                            localStorage.setItem('neptune_stats', JSON.stringify(this.stats));
                        } else {
                            throw new Error('خطا در صدور لایسنس از سرور');
                        }
                    } catch (e) {
                        console.warn('Fallback to client token generator:', e);
                        const payload = {
                            v: 2,
                            kid: 'neptune-root-2026',
                            lic_id: 'offline-' + Math.random().toString(36).substring(2, 10),
                            org: this.licenseGen.customer_name,
                            tier: this.licenseGen.plan,
                            fingerprint: this.licenseGen.fingerprint || '*',
                            limits: {
                                companies: parseInt(this.licenseGen.companies) || 1,
                                users: parseInt(this.licenseGen.users) || 3,
                                devices: parseInt(this.licenseGen.users) || 3
                            },
                            issued_at: Math.floor(Date.now() / 1000),
                            expires_at: this.licenseGen.duration === 'lifetime' ? null : Math.floor(Date.now() / 1000) + (parseInt(this.licenseGen.duration) * 86400)
                        };
                        const jsonStr = JSON.stringify(payload);
                        const b64 = btoa(unescape(encodeURIComponent(jsonStr))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                        const dummySig = Array.from(crypto.getRandomValues(new Uint8Array(64)))
                            .map(b => b.toString(16).padStart(2, '0')).join('');
                        this.generatedKey = 'NEPTUNE-LIC-v2.' + b64 + '.' + dummySig;
                        this.stats.licensesIssued++;
                        localStorage.setItem('neptune_stats', JSON.stringify(this.stats));
                    } finally {
                        this.isGenerating = false;
                    }
                },

                copyText(text) {
                    navigator.clipboard.writeText(text);
                    this.copiedKey = true;
                    setTimeout(() => this.copiedKey = false, 2500);
                }
            };
        }
    </script>

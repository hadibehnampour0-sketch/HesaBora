<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="لوگوی رسمی سامانه دخل (Dakhl) - Google Flow Helix">
  <defs>
    <!-- Background Ambient Glow & Drop Shadow -->
    <filter id="gf-shadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06B6D4" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
    
    <filter id="spark-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22D3EE" flood-opacity="0.8" />
    </filter>

    <!-- Main Outer Flow Ribbon Gradient -->
    <linearGradient id="gf-main" x1="30" y1="25" x2="175" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Inner Ribbon Occlusion / 3D Fold Gradient -->
    <linearGradient id="gf-inner" x1="150" y1="40" x2="60" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Top Glossy Specular Ridge Highlight -->
    <linearGradient id="gf-highlight" x1="40" y1="30" x2="160" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#A5F3FC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Core AI Spark Gradient -->
    <linearGradient id="gf-spark" x1="60" y1="60" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- 3D Ribbon Underfold / Depth Layer -->
  <path d="M142 48 C158 68 162 105 145 136 C130 162 98 174 66 166 C42 160 38 144 54 136 C74 126 112 134 128 108 C142 86 126 62 102 62 C85 62 76 74 65 74 C54 74 48 62 60 50 C78 32 120 25 142 48 Z" 
        fill="url(#gf-inner)" opacity="0.95" />

  <!-- Main Continuous Fluid 3D Ribbon (Forming Latin 'D' & Persian 'د') -->
  <path d="M144 46 C168 70 172 114 148 145 C124 176 72 174 48 148 C32 130 40 110 60 108 C86 106 118 124 132 98 C144 72 116 52 94 60 C78 65 68 52 78 42 C95 24 128 28 144 46 Z" 
        fill="url(#gf-main)" filter="url(#gf-shadow)" />

  <!-- Specular Light Sheen Along Top Curvature -->
  <path d="M84 40 C102 26 130 30 144 46 C158 62 164 92 152 118 C148 112 144 86 132 70 C118 52 98 48 84 40 Z" 
        fill="url(#gf-highlight)" />

  <!-- Google Flow & Gemini AI 4-Point Radiant Sparkle Star -->
  <path d="M78 62 C78 72 68 82 58 82 C68 82 78 92 78 102 C78 92 88 82 98 82 C88 82 78 72 78 62 Z" 
        fill="url(#gf-spark)" filter="url(#spark-glow)" />

  <!-- Center Core Inflow Node (Financial Token / Liquidity Point) -->
  <circle cx="78" cy="82" r="5" fill="#FFFFFF" opacity="0.95" />
</svg>